[package]
name = "clip-clip-go"
version = "0.1.0"
description = "Clip-Clip-Go desktop application"
edition = "2021"
default-run = "clip-clip-go"

[[bin]]
name = "clipclipgo-native-host"
path = "src/bin/clipclipgo-native-host.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.11"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.11"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff"] }
pulldown-cmark = { version = "=0.13.6", default-features = false, features = ["html"] }
htmd = "=0.5.6"
base64 = "0.23"
markup5ever_rcdom = "=0.38.0"
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_8125", "thread_safe", "image_025"] }
ttf-parser = "=0.25.1"
# Existing locked crates, used for Windows IPC/setup and scoped browser media transport.
url = "=2.5.8"
getrandom = "=0.4.3"
quick-xml = "=0.42.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Networking_WinHttp"] }

[dev-dependencies]
# Already used by image's TIFF codec; direct access generates real multipage fixtures.
tiff = "=0.11.3"
